[workspace]
authors = ["Yuanpeng Zhang <zyroc1990@gmail.com>"]
channels = ['conda-forge']
name = "backend"
platforms = ['osx-arm64']
version = "0.1.0"

[tasks]
serve = "uvicorn app.server:app --port 8765"

[dependencies]
python = ">=3.11"

[pypi-dependencies]
fastapi = ">=0.115"
uvicorn = { version = ">=0.30", extras = ["standard"] }
python-multipart = ">=0.0.9"
python-dotenv = ">=1.0"
pydantic = ">=2.7"

pandas = ">=2.2"
numpy = ">=1.26"
scipy = ">=1.12"
scikit-learn = ">=1.4"
openpyxl = ">=3.1"
matplotlib = ">=3.8"
python-docx = ">=1.1"

# SAASBO (fully-Bayesian GP) support
jax = ">=0.4.25"
jaxlib = ">=0.4.25"
numpyro = ">=0.14"

# LLM agents
langchain-core = ">=0.3"
langchain-anthropic = ">=0.3"
langchain-openai = ">=0.3"
anthropic = ">=0.40"
